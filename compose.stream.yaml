services:
  sim:
    working_dir: /workspace
    entrypoint: ["/isaac-sim/python.sh", "/workspace/src/saronic_sim/cli.py"]
    command:
      - "harbor"
      - "--stream"
      - "--x"
      - "${BOAT_X:-0}"
      - "--y"
      - "${BOAT_Y:-0}"
      - "--scenario"
      - "${HARBOR_SCENARIO:-/workspace/scenarios/harbor.json}"
      - "--/exts/omni.kit.livestream.app/primaryStream/publicIp=${ISAACSIM_HOST:?Set ISAACSIM_HOST to the Brev public IP}"
      - "--/exts/omni.kit.livestream.app/primaryStream/signalPort=49100"
      - "--/exts/omni.kit.livestream.app/primaryStream/streamPort=47998"
    healthcheck:
      test: ["CMD-SHELL", "test -f /workspace/output/.harbor-ready"]
      interval: 30s
      timeout: 10s
      start_period: 600s
      retries: 5
    restart: unless-stopped

  web-viewer:
    build:
      context: ./streaming/web-viewer
      network: host
      args:
        ISAACSIM_HOST: ${ISAACSIM_HOST:?Set ISAACSIM_HOST to the Brev public IP}
        ISAACSIM_SIGNAL_PORT: "49100"
        ISAACSIM_STREAM_PORT: "47998"
    network_mode: host
    depends_on:
      sim:
        condition: service_healthy
    restart: unless-stopped
