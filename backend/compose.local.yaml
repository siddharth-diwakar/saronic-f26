# Local database only. Production PostgreSQL is a separate Coolify resource.
name: saronic-backend-local
services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: saronic
      POSTGRES_USER: saronic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saronic -d saronic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18_data:
